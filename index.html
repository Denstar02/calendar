<script>
(function () {
  var r = document.documentElement, s = null, t = null, intro = false;
  try {
    s = localStorage.getItem('kp-style'); t = localStorage.getItem('kp-theme');
    if (localStorage.getItem('kp-term-intro') !== '1') {
      localStorage.setItem('kp-term-intro', '1');
      if (s !== 'term') { s = 'term'; intro = true; localStorage.setItem('kp-style', 'term'); }
    }
  } catch (e) { /* хранилище недоступно */ }
  if (s !== 'paper' && s !== 'vhs' && s !== 'term') s = 'term';
  r.setAttribute('data-style', s);
  window.kpTermIntro = intro;
  if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t);
  var C = s === 'vhs' ? ['#F1ECE1', '#23252D'] : s === 'term' ? ['#F4ECDC', '#25201A'] : ['#FBFCFE', '#121A17'];
  var m = document.querySelectorAll('meta[name="theme-color"]');
  if (m[0]) m[0].setAttribute('content', t === 'dark' ? C[1] : C[0]);
  if (m[1]) m[1].setAttribute('content', t === 'light' ? C[0] : C[1]);
})();
</script>

<style>

:root {
  --paper: #FBFCFE;

  --ink-3: #78819A;
  --pen: #2441A6;
  --pen-ink: #FFFFFF;
  --pen-soft: rgba(36, 65, 166, 0.09);
  --red: #CF3135;
  --red-line: rgba(207, 49, 53, 0.55);
  --red-soft: rgba(207, 49, 53, 0.08);
  --ok: #1D7A47;
  --warn: #B87200;
  --toast-bg: #1B2238;
  --toast-fg: #F4F6FB;
  --toast-act: #A9C0FF;
  --shadow: 0 1px 2px rgba(18, 28, 58, 0.06), 0 12px 32px rgba(18, 28, 58, 0.16);
  --backdrop: rgba(14, 20, 38, 0.36);
  --hl-lec: rgba(255, 204, 0, 0.34);
  --hl-lec-ink: #7A5900;
  --hl-pr: rgba(46, 190, 104, 0.25);
  --hl-pr-ink: #176238;
  --hl-sem: rgba(58, 150, 255, 0.22);
  --hl-sem-ink: #1A5394;
  --hl-lab: rgba(255, 80, 150, 0.22);
  --hl-lab-ink: #9E1C5B;
  --hl-con: rgba(255, 140, 30, 0.27);
  --hl-con-ink: #8C4A07;
  --hl-zach: rgba(140, 98, 255, 0.22);
  --hl-zach-ink: #5133AE;
  --hl-exam: rgba(238, 60, 48, 0.22);
  --hl-exam-ink: #A2231B;
  --cat-dept: #2441A6;
  --cat-meet: #55607A;
  --cat-sci: #0D7377;
  --cat-stud: #8A3BA3;
  --cat-pers: #9A5911;
  --cat-other: #687083;
  --hl: var(--hl-lec);
  --hl-ink: var(--hl-lec-ink);
  --cat: var(--cat-other);
  --top-x: 0px;
  --font-osd: "VT323", "JetBrains Mono", monospace;
  --font-display: "PT Serif", Georgia, "Times New Roman", serif;
  --font-ui: "Golos Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--paper); }
html.locked, html.locked body { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; margin: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
svg { display: block; }
a { color: var(--pen); }
.vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.lbl { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.noscript { max-width: 640px; margin: 24px auto; padding: 0 16px; font-size: 16px; }

/* шапка */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); border-bottom: 1px solid var(--rule-2); }
.top-in {
  max-width: 1320px;
  margin: 0 auto;
  padding-block: 12px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "title tools" "nav nav";
  gap: 10px 12px;
  align-items: center;
}
.title-block { grid-area: title; min-width: 0; }
.title-block h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; }
.sub { margin-top: 3px; min-height: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.par { display: inline-block; padding: 0 6px; border: 1px solid currentColor; border-radius: 4px; color: var(--pen); font-size: 12px; font-weight: 600; line-height: 18px; }
.sub .hol { color: var(--red); font-weight: 600; }
.tools { grid-area: tools; display: flex; align-items: center; gap: 4px; }
@media (max-width: 599px) { .tools { gap: 2px; } .tools .icon-btn { width: 36px; } }
.osd, .tline { display: none; }
.stylepick { position: relative; display: inline-flex; }
.smenu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 5; min-width: 230px; padding: 6px; display: flex; flex-direction: column; gap: 2px; background: var(--sheet); border: 1px solid var(--rule-2); border-radius: 10px; box-shadow: var(--shadow); }
.smenu button { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 10px; border-radius: 6px; color: var(--ink); font-size: 14px; white-space: nowrap; }
.smenu button:hover, .smenu button:focus-visible { background: var(--paper-2); }
.smenu button svg { width: 20px; height: 20px; flex: none; }
.smenu button[aria-checked="true"] { font-weight: 600; }
.smenu button[aria-checked="true"]::after { content: ""; width: 8px; height: 8px; margin-left: auto; border-radius: 50%; background: var(--pen); }
.smenu-sep { height: 1px; margin: 4px 4px; background: var(--rule-2); }
.smenu-th { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; }
.smenu .smenu-th button { justify-content: center; min-height: 38px; padding: 0 4px; font-size: 13px; }
.smenu .smenu-th button[aria-checked="true"] { background: var(--paper-3); }
.smenu .smenu-th button[aria-checked="true"]::after { content: none; }
.chip svg { width: 16px; height: 16px; flex: none; }
.navrow { grid-area: nav; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.nav { display: flex; align-items: center; gap: 2px; }
@media (min-width: 900px) {
  .top-in { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "title nav tools"; padding-block: 16px 14px; gap: 10px 22px; }
  .title-block h1 { font-size: 28px; }
  .navrow { gap: 14px; }
}
.top-in.has-filt { grid-template-areas: "title tools" "nav nav" "filt filt"; }
@media (min-width: 900px) { .top-in.has-filt { grid-template-areas: "title nav tools" "filt filt filt"; } }
.filt { grid-area: filt; display: flex; align-items: center; gap: 8px; min-width: 0; padding: 3px 3px 3px 10px; border-radius: 8px; background: var(--pen-soft); color: var(--ink-2); font-size: 13.5px; }
.filt > svg { width: 16px; height: 16px; flex: none; color: var(--pen); }
.filt-t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filt-t b { font-weight: 600; color: var(--ink); }
.filt .btn-sm { min-height: 30px; padding: 0 10px; }
.filt .icon-btn { width: 32px; height: 32px; }
@media (min-width: 900px) and (max-width: 1199px) {
  .top-in { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "title tools" "nav nav"; }
  .top-in.has-filt { grid-template-areas: "title tools" "nav nav" "filt filt"; }
}

/* кнопки */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--sheet); color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.btn:hover { background: var(--paper-2); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn svg { width: 18px; height: 18px; }
.btn-pen { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); font-weight: 600; }
.btn-pen:hover { background: var(--pen); filter: brightness(1.1); }
.btn-danger { color: var(--red); }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-today.is-on { color: var(--ink-3); }
.today-ico { display: none; place-items: center; width: 24px; height: 24px; border: 1.6px solid currentColor; border-top-width: 4px; border-radius: 4px; font-size: 11px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--paper-2); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn { position: relative; }
.ib-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--pen); box-shadow: 0 0 0 2px var(--paper); }
.desk-only { display: none; }
@media (min-width: 900px) { .desk-only { display: inline-flex; } }
.seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--paper-2); }
.seg button { min-height: 32px; padding: 0 12px; border-radius: 6px; font-size: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--rule-2); }
.seg button:disabled { opacity: 0.6; }
.seg button { position: relative; }
.tab-dot { position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
@media (max-width: 599px) {
  .navrow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
  .navrow .seg { display: flex; min-width: 0; }
  .navrow .seg button { flex: 1 1 auto; min-width: 0; padding: 0 4px; font-size: 13.5px; text-align: center; overflow: hidden; text-overflow: ellipsis; }
  .nav .icon-btn { width: 34px; }
  .btn-today { width: 34px; min-height: 38px; padding: 0; border-color: transparent; background: none; color: var(--ink-2); }
  .btn-today:hover { background: var(--paper-2); }
  .today-txt { display: none; }
  .today-ico { display: grid; }
}
@media (max-width: 379px) { .navrow .seg button { padding: 0 2px; font-size: 13px; } .nav .icon-btn, .btn-today { width: 32px; } }

/* синхронизация */
.sync { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 8px; border-radius: 8px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.sync:hover { background: var(--paper-2); color: var(--ink-2); }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.sync[data-s="ok"] .dot { background: var(--ok); }
.sync[data-s="saving"] .dot { background: var(--warn); animation: blink 0.9s ease-in-out infinite alternate; }
.sync[data-s="offline"] .dot { background: var(--warn); }
.sync[data-s="err"] .dot { background: var(--red); }
.sync[data-s="local"] .dot { background: transparent; box-shadow: inset 0 0 0 1.6px var(--ink-3); }
.sync-l { display: none; }
@media (min-width: 1440px) { .sync-l { display: inline; } }
@keyframes blink { from { opacity: 1; } to { opacity: 0.3; } }

/* плашки */
.banner { border-bottom: 1px solid var(--rule-2); background: var(--pen-soft); }
.banner.warn { background: var(--red-soft); }
.banner-in {
  max-width: 1320px;
  margin: 0 auto;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  font-size: 14px; color: var(--ink-2);
}
.banner-in p { max-width: 78ch; }

/* основная область */
.main {
  max-width: 1320px;
  margin: 0 auto;
  padding-block: 14px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 900px) { .main { padding-block: 18px 64px; } }
.empty { max-width: 760px; margin: 0 auto 14px; padding: 12px 14px; border: 1px dashed var(--rule-2); border-radius: 8px; background: var(--sheet); color: var(--ink-2); font-size: 14px; }
.paper {
  background-color: var(--paper);
  background-image: linear-gradient(to bottom, var(--rule) 1px, transparent 1px), linear-gradient(to right, var(--rule) 1px, transparent 1px);
  background-size: var(--sq, 16px) var(--sq, 16px);
}
.ring { position: relative; }
.ring::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: calc(100% + 18px); height: calc(100% + 6px); min-width: 32px; min-height: 30px;
  border: 1.6px solid var(--red);
  border-radius: 52% 48% 55% 45% / 48% 56% 44% 52%;
  transform: translate(-50%, -50%) rotate(-9deg);
  pointer-events: none; opacity: 0.9;
}

/* маркеры типов */
.hl-lec { --hl: var(--hl-lec); --hl-ink: var(--hl-lec-ink); }
.hl-pr { --hl: var(--hl-pr); --hl-ink: var(--hl-pr-ink); }
.hl-sem { --hl: var(--hl-sem); --hl-ink: var(--hl-sem-ink); }
.hl-lab { --hl: var(--hl-lab); --hl-ink: var(--hl-lab-ink); }
.hl-con { --hl: var(--hl-con); --hl-ink: var(--hl-con-ink); }
.hl-zach { --hl: var(--hl-zach); --hl-ink: var(--hl-zach-ink); }
.hl-exam { --hl: var(--hl-exam); --hl-ink: var(--hl-exam-ink); }
.cat-dept { --cat: var(--cat-dept); }
.cat-meet { --cat: var(--cat-meet); }
.cat-sci { --cat: var(--cat-sci); }
.cat-stud { --cat: var(--cat-stud); }
.cat-pers { --cat: var(--cat-pers); }
.cat-other { --cat: var(--cat-other); }
.dc-diss { --cat: var(--cat-sci); }
.dc-article { --cat: var(--cat-dept); }
.dc-conf { --cat: var(--cat-stud); }
.dc-teach { --cat: var(--cat-pers); }
.dc-other { --cat: var(--cat-other); }
mark { background: var(--hl-lec); color: inherit; border-radius: 2px; padding: 0 1px; }
.sample { display: inline-block; padding: 0 4px; border: 1px dashed currentColor; border-radius: 3px; color: var(--ink-3); font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; line-height: 15px; }

/* день */
.day { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.sd { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 7px; border-radius: 8px; color: var(--ink); }
.sd:hover { background: var(--paper-2); }
.sd.is-sel { background: var(--paper-3); }
.sd-w { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.sd-n { font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.25; min-width: 1.4em; text-align: center; }
.sd.is-hol .sd-w, .sd.is-hol .sd-n { color: var(--red); }
.sd-m { display: flex; gap: 2px; height: 4px; }
.sd-m i { display: block; width: 7px; height: 4px; border-radius: 1px; background: var(--hl-ink); opacity: 0.75; }
.sd-m i.ink { background: var(--cat); }
.hol-line { display: flex; align-items: center; gap: 8px; color: var(--red); font-weight: 600; font-size: 14px; }
.hol-line::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--red); flex: none; }
.status { display: flex; align-items: baseline; gap: 9px; padding: 9px 12px; border-radius: 8px; background: var(--paper-2); color: var(--ink-2); font-size: 14px; }
.status b { color: var(--ink); font-weight: 600; }
.status .live { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex: none; align-self: center; }
.status .live.soft { background: var(--pen); }
.sec { display: flex; flex-direction: column; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.dl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 7px 10px 7px 8px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--sheet); }
.dl-box { display: grid; place-items: center; width: 26px; height: 26px; border: 1.6px solid var(--red); border-radius: 5px; color: var(--red); flex: none; }
.dl-box svg { width: 18px; height: 18px; }
.dl-t { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 2px 0; text-align: left; }
.dl-title { font-weight: 500; overflow-wrap: anywhere; }
.dl-when { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.dl.is-over .dl-when { color: var(--red); font-weight: 600; }
.dl.is-done .dl-title { text-decoration: line-through; color: var(--ink-3); }
.dl.is-done .dl-box { border-color: var(--ink-3); color: var(--ok); }
@media (max-width: 480px) { .dl { grid-template-columns: auto minmax(0, 1fr); } .dl-when { grid-column: 2; } }
.quiet { color: var(--ink-3); font-size: 14px; }

.ladder { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule-2); --sq: 16px; }
.row { display: grid; grid-template-columns: 78px minmax(0, 1fr); border-bottom: 1px solid var(--rule); }
.row:last-child { border-bottom: 0; }
.ax { display: flex; justify-content: flex-end; align-items: flex-start; gap: 8px; padding: 10px 10px 10px 4px; background: var(--paper); border-right: 1.5px solid var(--red-line); }
.ax-n { font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1; color: var(--ink); white-space: nowrap; }
.ax-t { display: flex; flex-direction: column; align-items: flex-end; font-family: var(--font-mono); font-size: 11px; line-height: 1.35; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ax-now { margin-top: 3px; font-family: var(--font-ui); font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--red); }
.row.is-now .ax-n { color: var(--red); }
.row.is-time .ax-t { color: var(--ink-2); }
.cells { min-width: 0; padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; }
.row.is-empty .cells { padding: 0; }
.row.is-past .cells { opacity: 0.55; }
.slot { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 44px; padding: 0 12px; color: var(--ink-3); font-size: 13px; }
.slot-l { font-style: italic; }
.slot-p { font-size: 20px; line-height: 1; opacity: 0; color: var(--pen); }
button.slot:hover { background: var(--band-hover); }
button.slot:hover .slot-p, button.slot:focus-visible .slot-p { opacity: 1; }
@media (hover: none) { .slot-p { opacity: 0.45; } }

.card { display: flex; flex-direction: column; gap: 3px; width: 100%; padding: 9px 12px 10px; border-radius: 4px; text-align: left; color: var(--ink); }
.card.hl { background: var(--hl); }
.card.ink { background: var(--sheet); border: 1.5px solid var(--cat); }
.card:hover { box-shadow: inset 0 0 0 1px var(--rule-2); }
.c-top { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12.5px; color: var(--ink-2); }
.tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--hl-ink); }
.ink .tag { color: var(--cat); }
.rep { font-size: 11.5px; font-weight: 600; color: var(--pen); }
.c-title { font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.c-sub { font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.flag { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.flag-red { color: var(--red); }
.flag-pen { color: var(--pen); }
.flag-ok { color: var(--ok); }
.is-cancelled { background: transparent !important; border: 1.5px dashed var(--rule-2) !important; }
.is-cancelled .c-title, .is-cancelled .b-title { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--ink-3); }
.is-ghost { background: transparent !important; border: 1px dashed var(--ink-3) !important; opacity: 0.8; }
.is-ghost .c-title, .is-ghost .b-title { color: var(--ink-3); }

/* неделя */
.week { --axw: 62px; }
.wg { display: grid; grid-template-columns: var(--axw) repeat(var(--cols), minmax(0, 1fr)); }
.wk-head { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 0px) + var(--top-x, 0px)); z-index: 6; background: var(--paper); border-bottom: 1px solid var(--rule-2); }
.wk-corner { display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; padding: 6px 9px 7px 0; border-right: 1.5px solid var(--red-line); font-size: 10.5px; line-height: 1.2; color: var(--ink-3); text-align: right; }
.wk-corner b { font-family: var(--font-display); font-size: 18px; line-height: 1.1; color: var(--ink); }
.wk-dh { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 1px; min-width: 0; padding: 6px 2px 7px; }
.wk-dh:hover { background: var(--paper-2); }
.wk-dh .w { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.wk-dh .n { font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.25; min-width: 1.4em; text-align: center; }
.wk-dh .h { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10.5px; color: var(--red); }
.wk-dh.is-hol .w, .wk-dh.is-hol .n { color: var(--red); }
.wk-ad { border-bottom: 1px solid var(--rule-2); }
.wk-adc { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 4px 3px; border-left: 1px solid var(--rule); }
.chip-d, .chip-e { display: block; width: 100%; padding: 3px 6px; border-radius: 3px; font-size: 11.5px; line-height: 1.3; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-d { border: 1px solid var(--red-line); background: var(--sheet); color: var(--red); font-weight: 600; }
.chip-d.is-done { border-color: var(--rule-2); color: var(--ink-3); text-decoration: line-through; font-weight: 500; }
.chip-e { border: 1.5px solid var(--cat); background: var(--sheet); color: var(--ink); }
.wk-body { position: relative; border-bottom: 1px solid var(--rule-2); }
.wk-axis { position: relative; background: var(--paper); border-right: 1.5px solid var(--red-line); }
.wk-ax { position: absolute; right: 9px; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.wk-ax .n { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--ink); }
.wk-ax .t { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.now-t { position: absolute; right: 4px; z-index: 5; transform: translateY(-50%); padding: 1px 4px; border-radius: 3px; background: var(--red); color: var(--paper); font-family: var(--font-mono); font-size: 10.5px; line-height: 1.3; }
.wk-col { position: relative; min-width: 0; border-left: 1px solid var(--rule); }
.wk-col.is-today { background: var(--today-col); }
.band { position: absolute; left: 0; right: 0; background: var(--band); border-top: 1px solid var(--rule); }
.band:hover { background: var(--band-hover); }
.blk { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 1px; padding: 3px 5px; border-radius: 3px; overflow: hidden; text-align: left; font-size: 11.5px; line-height: 1.25; color: var(--ink); }
.blk.hl { background: var(--hl); }
.blk.ink { background: var(--sheet); border: 1.5px solid var(--cat); }
.blk:hover { box-shadow: 0 0 0 1px var(--rule-2); }
.b-top { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; overflow: hidden; }
.b-top > * { flex: none; }
.b-tag { font-weight: 700; color: var(--hl-ink); }
.ink .b-tag { color: var(--cat); }
.b-top > .b-grp { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.b-tm { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-2); }
.b-fl { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--pen); }
.b-fl.red { color: var(--red); }
.b-smp { font-size: 9.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); }
.b-title { font-size: 12px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; -webkit-hyphens: auto; hyphens: auto; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--cl, 3); overflow: hidden; }
.b-room { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now { position: absolute; left: -1px; right: 0; height: 0; border-top: 2px solid var(--red); z-index: 4; pointer-events: none; }
.now::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
@media (max-width: 599px) {
  .week { --axw: 36px; }
  .wk-corner { padding-right: 5px; font-size: 9.5px; }
  .wk-corner b { font-size: 15px; }
  .wk-ax { right: 4px; }
  .wk-ax .n { font-size: 14px; }
  .wk-ax .t { font-size: 9px; }
  .wk-ax .te { display: none; }
  .wk-dh .n { font-size: 16px; }
  .wk-dh .h { display: none; }
  .blk { padding: 2px 3px; font-size: 10px; }
  .b-title { font-size: 10.5px; }
  .b-top > .b-grp, .b-room, .b-smp, .b-tm { display: none; }
  .chip-d, .chip-e { padding: 2px 3px; font-size: 10px; }
  .now-t { display: none; }
}

/* месяц */
.month { --wkw: 38px; }
.mo-grid { display: grid; grid-template-columns: var(--wkw) repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--rule-2); border-left: 1px solid var(--rule-2); }
.mo-h { padding: 6px 7px; border-right: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule-2); background: var(--paper-2); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.mo-hw { padding-inline: 2px; text-align: center; border-right: 1.5px solid var(--red-line); }
.mo-wk { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 0; border-right: 1.5px solid var(--red-line); border-bottom: 1px solid var(--rule-2); background: var(--paper); font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); }
.mo-wk:hover { background: var(--paper-2); }
.mo-wk b { font-weight: 600; color: var(--ink); }
.mo-wk small { font-family: var(--font-ui); font-size: 9.5px; color: var(--ink-3); }
.mo-wk .one { display: none; }
.mo-c { display: flex; flex-direction: column; align-items: stretch; gap: 3px; min-width: 0; min-height: 112px; padding: 6px; border-right: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule-2); background: var(--paper); text-align: left; }
.mo-c:hover { background: var(--paper-2); }
.mo-c.is-out { background: var(--paper-2); }
.mo-c.is-out > * { opacity: 0.5; }
.mo-n { align-self: flex-start; padding: 0 3px; font-family: var(--font-display); font-size: 15px; font-weight: 700; line-height: 1.3; }
.mo-c.is-hol .mo-n { color: var(--red); }
.mo-hol { font-size: 10.5px; line-height: 1.2; color: var(--red); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mo-it { display: block; padding: 1px 4px; border-radius: 2px; font-size: 11.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.mo-it.hl { background: var(--hl); }
.mo-it.ink { box-shadow: inset 0 0 0 1px var(--cat); }
.mo-it.dlm { padding-left: 2px; color: var(--red); font-weight: 600; }
.mo-it.dlm.is-done { color: var(--ink-3); text-decoration: line-through; font-weight: 500; }
.mo-it.is-cancelled { text-decoration: line-through; opacity: 0.5; }
.mo-pre { margin-right: 4px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-2); }
.mo-more { padding-left: 4px; font-size: 11px; color: var(--ink-3); }
@media (max-width: 599px) {
  .month { --wkw: 24px; }
  .mo-h { padding: 5px 2px; font-size: 10px; letter-spacing: 0.02em; text-align: center; }
  .mo-hw { font-size: 0; }
  .mo-wk { padding: 6px 0; font-size: 11px; }
  .mo-wk .lng { display: none; }
  .mo-wk .one { display: inline; }
}
/* компактный месяц на телефоне: под датой номера занятых пар, точка — мероприятие, уголок — срок; под сеткой список выбранного дня */
.month.is-compact .mo-c { position: relative; align-items: center; gap: 6px; min-height: 60px; padding: 7px 1px 6px; }
.month.is-compact .mo-n { align-self: center; padding: 0 2px; font-size: 15px; line-height: 1.2; }
.month.is-compact .mo-c.is-sel { background: var(--paper-3); box-shadow: inset 0 0 0 2px var(--pen); }
.mo-c.has-dl::after { content: ""; position: absolute; top: 0; right: 0; border-top: 10px solid var(--red); border-left: 10px solid transparent; }
.mo-c.is-out.has-dl::after { opacity: 0.5; }
.mo-sum { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 1px 5px; max-width: 100%; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; line-height: 1.2; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.mo-sum b { font-weight: inherit; white-space: nowrap; }
.mo-dot { flex: none; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--pen); }
.mo-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 8px; font-size: 12.5px; line-height: 1.3; color: var(--ink-3); }
.mo-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.mo-legend .mo-sum { flex-wrap: nowrap; }
.mo-corner { flex: none; display: inline-block; width: 0; height: 0; border-top: 10px solid var(--red); border-left: 10px solid transparent; }
.mo-ag { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.mo-ag-h { font-size: 17px; font-weight: 700; line-height: 1.3; color: var(--ink); }
.mo-ag .quiet { margin: 0; }

/* шторка и формы */
.backdrop { position: fixed; inset: 0; z-index: 50; background: var(--backdrop); opacity: 0; transition: opacity 0.2s ease; }
.backdrop.open { opacity: 1; }
.sheet {
  position: fixed; z-index: 51; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column;
  max-height: calc(100vh - env(safe-area-inset-top, 0px) - 12px);
  max-height: calc(100dvh - env(safe-area-inset-top, 0px) - 12px);
  background: var(--sheet); color: var(--ink);
  border-radius: 14px 14px 0 0; box-shadow: var(--shadow);
  transform: translateY(100%);
  transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheet.open { transform: none; }
.sh-form { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
.sh-head {
  display: flex; align-items: flex-start; gap: 10px;
  padding-block: 14px 10px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule);
}
.sh-ttl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.sh-ttl h2 { font-family: var(--font-display); font-size: 21px; line-height: 1.2; overflow-wrap: anywhere; }
.sh-ttl h2:focus { outline: none; }
.sh-kick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.kick { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.kick.hl { background: var(--hl); color: var(--ink); }
.kick.ink { border: 1.5px solid var(--cat); color: var(--cat); }
.kick.dlm { border: 1.5px solid var(--red); color: var(--red); }
.sh-body {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 18px;
  padding-block: 16px 20px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.sh-foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  border-top: 1px solid var(--rule); background: var(--sheet);
}
.grow { flex: 1 1 auto; }
.foot-q { flex-basis: 100%; font-size: 14px; color: var(--ink-2); }
@media (min-width: 760px) {
  .sheet {
    left: 50%; right: auto; top: 50%; bottom: auto;
    width: min(600px, calc(100vw - 48px));
    max-height: calc(100vh - 64px);
    max-height: calc(100dvh - 64px);
    border-radius: 12px; opacity: 0;
    transform: translate(-50%, -47%);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .sheet.open { opacity: 1; transform: translate(-50%, -50%); }
  .sh-foot { padding-block: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .sheet, .backdrop { transition: none; }
  .sync[data-s="saving"] .dot { animation: none; }
}
.facts { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px 14px; margin: 0; }
.facts > div { display: contents; }
.facts dt { padding-top: 3px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.facts dd { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.facts dd.note { white-space: pre-wrap; }
@media (max-width: 440px) { .facts { grid-template-columns: minmax(0, 1fr); gap: 2px; } .facts dd { margin-bottom: 10px; } }
.stat { padding: 10px 12px; border-radius: 8px; background: var(--pen-soft); font-size: 14px; }
.stat.red { background: var(--red-soft); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .flabel, legend { padding: 0; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.in { display: block; width: 100%; min-width: 0; min-height: 44px; padding: 10px 12px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1.3; }
.in:focus { outline: 2px solid var(--pen); outline-offset: -1px; }
.in[aria-invalid="true"] { border-color: var(--red); }
.in:disabled { opacity: 0.6; }
textarea.in { min-height: 76px; resize: vertical; }
textarea.code { min-height: 0; font-family: var(--font-mono); font-size: 13px; line-height: 1.4; word-break: break-all; }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 11px; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--paper); color: var(--ink-2); font-size: 14px; white-space: nowrap; }
.chip:hover { color: var(--ink); border-color: var(--ink-3); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
.chip:disabled { opacity: 0.6; }
.chip .sw { width: 12px; height: 12px; border-radius: 2px; background: var(--hl); box-shadow: inset 0 0 0 1px var(--hl-ink); flex: none; }
.chip .sw.ink { background: transparent; box-shadow: inset 0 0 0 2px var(--cat); }
.chip-t { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.chip-t b { font-family: var(--font-ui); font-size: 14px; }
.chip-t[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); box-shadow: none; }
.chip-t.is-span { background: var(--pen-soft); border-color: var(--pen); color: var(--ink); }
.seg-full { display: flex; }
.seg-full button { flex: 1; }
.seg-sm { align-self: flex-start; }
.seg-sm button { min-height: 30px; padding: 0 10px; font-size: 13px; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.hint { font-size: 13px; color: var(--ink-3); }
.err { font-size: 13px; font-weight: 500; color: var(--red); }
.check { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--pen); flex: none; }
.set { display: flex; flex-direction: column; gap: 10px; }
.set + .set { padding-top: 16px; border-top: 1px solid var(--rule); }
.self-start { align-self: flex-start; }
.sem { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.sem-n { font-size: 14px; font-weight: 600; }
.bells { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.bells li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto minmax(0, 1fr) 38px; align-items: center; gap: 8px; }
.bn { font-family: var(--font-display); font-size: 18px; font-weight: 700; text-align: center; }
.dash { color: var(--ink-3); }
@media (max-width: 440px) { .sem { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); } .sem-n { grid-column: 1 / -1; } }
.sync-state { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.sync-state .dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.6px var(--ink-3); flex: none; }
.sync-state.is-on .dot { background: var(--ok); box-shadow: none; }
.howto { border: 1px solid var(--rule-2); border-radius: 8px; padding: 10px 12px; }
.howto summary { cursor: pointer; font-weight: 600; color: var(--pen); }
.howto-in { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; font-size: 14px; }
.steps code { font-family: var(--font-mono); font-size: 13px; }
.rules { margin: 0; padding: 10px 12px; border-radius: 6px; background: var(--paper-2); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; overflow-x: auto; white-space: pre; }

/* сроки */
.dlv { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.cnt { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .cnt { color: var(--ink-2); }
.prog { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13.5px; color: var(--ink-2); }
.prog-bar { flex: 1 1 140px; max-width: 280px; height: 6px; border-radius: 3px; background: var(--paper-3); overflow: hidden; }
.prog-bar i { display: block; height: 100%; border-radius: 3px; background: var(--cat); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.lbl-red { color: var(--red); }
.lnk { align-self: flex-start; padding: 4px 0; color: var(--pen); font-size: 13.5px; font-weight: 600; }
.lnk:hover { text-decoration: underline; }
.lnk-inline { display: inline; padding: 0; font-size: inherit; }
.empty-dl { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border: 1px dashed var(--rule-2); border-radius: 8px; background: var(--sheet); color: var(--ink-2); font-size: 14px; }
.empty-dl p { max-width: 64ch; }
.filt-empty { max-width: 760px; margin: 0 auto 12px; }
.dc-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cat); }
.dlr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 4px 12px; padding: 10px 12px 10px 10px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--sheet); }
.dlr .dl-box { margin-top: 1px; }
.dlr-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.dlr-title { font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.dlr-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.dlr-note { font-size: 13px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dlr-when { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-top: 2px; white-space: nowrap; }
.dlr-date { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.dlr .rel { font-size: 12.5px; color: var(--ink-3); }
.dlr.is-near .rel { color: var(--pen); font-weight: 600; }
.dlr.is-over { border-color: var(--red-line); }
.dlr.is-over .rel { color: var(--red); font-weight: 600; }
.dlr.is-done .dlr-title { text-decoration: line-through; color: var(--ink-3); }
.dlr.is-done .dl-box { border-color: var(--ink-3); color: var(--ok); }
@media (max-width: 480px) {
  .dlr { grid-template-columns: auto minmax(0, 1fr); }
  .dlr-when { grid-column: 2; flex-direction: row; align-items: baseline; gap: 10px; padding-top: 0; }
}

/* поиск */
.sheet.is-tall { height: calc(100vh - env(safe-area-inset-top, 0px) - 12px); height: calc(100dvh - env(safe-area-inset-top, 0px) - 12px); }
@media (min-width: 760px) { .sheet.is-tall { height: min(760px, calc(100vh - 64px)); height: min(760px, calc(100dvh - 64px)); } }
.sh-bar { padding-block: 10px 12px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--rule); }
.srch-in { position: relative; }
.srch-in svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.srch-in .in { padding-left: 38px; }
#srchFacets { display: flex; flex-direction: column; gap: 14px; }
#srchRes { display: flex; flex-direction: column; gap: 10px; }
.chip-more { border-style: dashed; color: var(--pen); }
.res-count { font-size: 13px; color: var(--ink-3); }
.res-list { display: flex; flex-direction: column; gap: 6px; }
.res { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 2px 12px; width: 100%; padding: 10px 12px 10px 10px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--paper); color: var(--ink); text-align: left; }
.res:hover { background: var(--paper-2); }
.res-mk { align-self: stretch; border-radius: 3px; background: var(--cat); }
.res-mk.hl { background: var(--hl-ink); opacity: 0.75; }
.res-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.res-title { font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.res-meta, .res-when { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.res-note { font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }
.res-date { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; white-space: nowrap; }
.res-date > span:first-child { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.res-date .rel { font-size: 12.5px; color: var(--ink-3); }
@media (max-width: 599px) {
  .facet .chips { flex-wrap: nowrap; overflow-x: auto; margin-inline: -18px; padding-inline: 18px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .facet .chips::-webkit-scrollbar { display: none; }
  .facet .chip { flex: none; }
}
@media (max-width: 480px) {
  .res { grid-template-columns: 6px minmax(0, 1fr); }
  .res-mk { grid-row: span 2; }
  .res-date { grid-column: 2; flex-direction: row; align-items: baseline; gap: 10px; }
}

/* уведомление и кнопка добавления */
.toast {
  position: fixed; z-index: 60; left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: max-content; max-width: calc(100vw - 32px);
  display: flex; align-items: center; gap: 12px;
  padding: 10px 10px 10px 16px; border-radius: 10px;
  background: var(--toast-bg); color: var(--toast-fg); box-shadow: var(--shadow); font-size: 14px;
}
.toast button { padding: 6px 10px; border-radius: 6px; color: var(--toast-act); font-weight: 700; white-space: nowrap; }
.t-msg { min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 899px) { .toast { bottom: calc(90px + env(safe-area-inset-bottom, 0px)); } }
.fab {
  position: fixed; z-index: 35;
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 2px);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%;
  background: var(--pen); color: var(--pen-ink); box-shadow: var(--shadow);
}
.fab svg { width: 26px; height: 26px; }
@media (min-width: 900px) { .fab { display: none; } }

html[data-style="vhs"] .top { border-bottom: 0; margin-bottom: 6px; box-shadow: 0 2px 0 var(--hl-lec), 0 4px 0 var(--hl-con), 0 6px 0 var(--stripe-3); }

  0%, 94%, 98%, 100% { transform: none; }

  function setView(v) {
    if (VIEWS.indexOf(v) < 0) return;
    var changed = S.view !== v;
    if (v !== 'deadlines') S.lastCalView = v;
    S.view = v; lsSet(LS_VIEW, v);
    render();
    if (changed) window.scrollTo(0, 0);
  }
  function navigate(dir) {
    if (S.view === 'deadlines') return;
    if (S.view === 'day') S.cursor = addKey(S.cursor, dir);
    else if (S.view === 'week') S.cursor = addKey(S.cursor, 7 * dir);
    else {
      var d = parseKey(S.cursor), nd = new Date(d.getFullYear(), d.getMonth() + dir, 1);
      var last = new Date(nd.getFullYear(), nd.getMonth() + 1, 0).getDate();
      S.cursor = keyOf(new Date(nd.getFullYear(), nd.getMonth(), Math.min(d.getDate(), last)));
    }
    render();
  }
  function goToday() { S.cursor = todayKey(); if (S.view === 'deadlines') setView(S.lastCalView || 'day'); else render(); }
  function addAt(col, e) {
    if (!canWrite() || !S.wk) return;
    var r = col.getBoundingClientRect(), min = S.wk.start + (e.clientY - r.top) / S.wk.ppm, k = col.getAttribute('data-col');
    for (var i = 0; i < S.bells.length; i++) if (min >= S.bells[i].s && min < S.bells[i].e) { openForm({ date: k, pair: i + 1 }); return; }
    openForm({ date: k, start: Math.max(0, Math.min(1380, Math.round(min / 15) * 15)) });
  }

  /* ---------- события интерфейса ---------- */
  $prev.addEventListener('click', function () { navigate(-1); });
  $next.addEventListener('click', function () { navigate(1); });
  $today.addEventListener('click', goToday);
  $seg.addEventListener('click', function (e) { var b = e.target.closest('[data-view]'); if (b) setView(b.getAttribute('data-view')); });
  $add.addEventListener('click', function () { openForm(newOpts()); });
  $fab.addEventListener('click', function () { openForm(newOpts()); });
  $set.addEventListener('click', function () { openSettings(false); });
  $search.addEventListener('click', function () { openSearch(false); });
  $styleBtn.addEventListener('click', function () { if ($styleMenu.hidden) openStyleMenu(); else closeStyleMenu(false); });
  $styleMenu.addEventListener('click', function (e) {
    var tb = e.target.closest('[data-theme-pick]');
    if (tb) { closeStyleMenu(true); setTheme(tb.getAttribute('data-theme-pick')); return; }
    var b = e.target.closest('[data-style-pick]');
    if (!b) return;
    var v = b.getAttribute('data-style-pick');
    closeStyleMenu(true);
    if (v !== curStyle()) { setStyle(v); styleToast(v); }
  });
  $styleMenu.addEventListener('keydown', function (e) {
    var items = Array.prototype.slice.call($styleMenu.querySelectorAll('button')), i = items.indexOf(document.activeElement), n = items.length;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + n) % n].focus(); }
    else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); items[n - 1].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeStyleMenu(true); }
    else if (e.key === 'Tab') closeStyleMenu(false);
    e.stopPropagation();
  });
  document.addEventListener('click', function (e) {
    if ($styleMenu.hidden || $stylePick.contains(e.target)) return;
    closeStyleMenu(false);
    e.stopPropagation();
    e.preventDefault();
  }, true);
  $filtEdit.addEventListener('click', function () { openSearch(false); });
  $filtClear.addEventListener('click', function () { S.filter = null; S.search = newSearch(); render(); $search.focus(); toast('Фильтр снят'); });
  $sync.addEventListener('click', function () { openSettings(true); });
  $backdrop.addEventListener('click', closeSheet);
  $banners.addEventListener('click', function (e) {
    var b = e.target.closest('[data-bn]'); if (!b) return;
    var a = b.getAttribute('data-bn');
    if (a === 'clear-samples') clearSamples();
    else if (a === 'open-sync') openSettings(true);
    else if (a === 'hide-hint') { lsSet(LS_HINT, '1'); renderBanners(); }
    else if (a === 'sync-accept' && S.pendingSync) connectSync(S.pendingSync);
    else if (a === 'sync-reject') { S.pendingSync = null; renderBanners(); }
    else if (a === 'retry' && S.sync) bootFire(S.sync, null);
  });
  $toast.addEventListener('click', function (e) {
    if (e.target.closest('[data-undo]') && S.undo) { var u = S.undo; S.undo = null; $toast.hidden = true; clearTimeout(S.toastT); u(); }
  });
  $main.addEventListener('click', function (e) {
    var t = e.target.closest('[data-open],[data-goto],[data-pick],[data-week],[data-add],[data-done],[data-col],[data-dl-cat],[data-dl-done],[data-dl-add],[data-dl-samples],[data-view-go]');
    if (!t || !$main.contains(t)) return;
    var ds = t.dataset;
    if (ds.open) openDetail(ds.open);
    else if (ds.done) toggleDone(ds.done);
    else if (ds.add) openForm({ date: ds.add, pair: +ds.pair || null });
    else if (ds.goto) { S.cursor = ds.goto; if (S.view !== 'day') setView('day'); else render(); }
    else if (ds.pick) { if (ds.pick === S.cursor) setView('day'); else { S.cursor = ds.pick; render(); } }
    else if (ds.week) { S.cursor = ds.week; setView('week'); }
    else if (ds.dlCat) { S.dlCat = ds.dlCat === 'all' ? null : ds.dlCat; render(); }
    else if (t.hasAttribute('data-dl-done')) { S.dlShowDone = !S.dlShowDone; render(); }
    else if (t.hasAttribute('data-dl-add')) openForm(newOpts());
    else if (t.hasAttribute('data-dl-samples')) addSampleDeadlines();
    else if (ds.viewGo) setView(ds.viewGo);
    else if (ds.col) addAt(t, e);
  });
  $sheet.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) { closeSheet(); return; }
    if (e.target.closest('[data-back]')) { openSearch(true); return; }
    var b = e.target.closest('button');
    if (!b || !$sheet.contains(b)) return;
    var type = S.sheet && S.sheet.type;
    if (type === 'detail' && b.dataset.act) onDetailAct(b.dataset.act);
    else if (type === 'form') onFormClick(b);
    else if (type === 'settings') onSettingsClick(b);
    else if (type === 'search') onSearchClick(b);
  });
  $sheet.addEventListener('scroll', function (e) { if (e.target && e.target.id === 'srchBody') S.search.scroll = e.target.scrollTop; }, true);
  $sheet.addEventListener('toggle', function (e) { if (e.target && e.target.id === 'howto') S.howtoOpen = e.target.open; }, true);
  $sheet.addEventListener('input', function (e) {
    var t = e.target;
    if (S.form) {
      var map = { 'f-title': 'title', 'f-group': 'group', 'f-room': 'room', 'f-note': 'note', 'f-start': 'start', 'f-end': 'end', 'f-until': 'until', 'f-date': 'date' };
      if (map[t.id]) S.form[map[t.id]] = t.value;
    } else if (S.sdraft) readSettingsInput(t);
    else if (t.id === 'q' && S.sheet && S.sheet.type === 'search') {
      S.search.q = t.value;
      clearTimeout(S.searchT);
      S.searchT = setTimeout(function () { updateSearch(false); }, 120);
    }
  });
  $sheet.addEventListener('change', function (e) {
    var t = e.target, F = S.form;
    if (F) {
      if (t.id === 'f-repeat') { F.repeat = t.value; F.repTouched = true; readForm(F); rerenderForm(); }
      else if (t.id === 'f-date') {
        F.date = t.value;
        var dh = $('h-f-date'); if (dh) dh.innerHTML = dateHint(F.date);
        var rh = $('h-f-repeat'); if (rh) rh.innerHTML = parityHint(F);
        if (!F.untilTouched && isKey(F.date)) { F.until = semEndFor(F.date); var u = $('f-until'); if (u) u.value = F.until; }
      } else if (t.id === 'f-until') { F.until = t.value; F.untilTouched = true; }
      else if (t.id === 'f-start' && F.kind !== 'deadline') {
        F.start = t.value;
        var s = toMin(t.value);
        if (s != null && (toMin(F.end) == null || toMin(F.end) <= s)) { F.end = hm2(Math.min(s + 90, 1439)); var en = $('f-end'); if (en) en.value = F.end; }
      }
    } else if (t.id === 's-import') { importFile(t.files && t.files[0]); }
    else if (S.sdraft) readSettingsInput(t);
  });
  $sheet.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'evForm') submitForm();
    else if (e.target.id === 'setForm') submitSettings();
    else if (e.target.id === 'srchForm') {
      clearTimeout(S.searchT); updateSearch(false);
      var q = $('q'); if (q && !mqFine.matches) q.blur();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (!$sheet.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
      else if (e.key === 'Tab') trapTab(e);
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))) return;
    switch (e.code) {
      case 'ArrowLeft': navigate(-1); break;
      case 'ArrowRight': navigate(1); break;
      case 'KeyT': goToday(); break;
      case 'KeyD': setView('day'); break;
      case 'KeyW': setView('week'); break;
      case 'KeyM': setView('month'); break;
      case 'KeyS': setView('deadlines'); break;
      case 'KeyF': case 'Slash': openSearch(false); break;
      case 'KeyN': if (canWrite()) openForm(newOpts()); else return; break;
      default: return;
    }
    e.preventDefault();
  });
  var sw = null;
  $main.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { sw = null; return; }
    var p = e.touches[0];
    sw = p.clientX < 24 ? null : { x: p.clientX, y: p.clientY, t: Date.now() };
  }, { passive: true });
  $main.addEventListener('touchend', function (e) {
    if (!sw) return;
    var p = e.changedTouches[0], dx = p.clientX - sw.x, dy = p.clientY - sw.y, dt = Date.now() - sw.t;
    sw = null;
    if (dt < 600 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) navigate(dx < 0 ? 1 : -1);
  }, { passive: true });
  onMq(mqNarrow, function () { render(); });
  if ('ResizeObserver' in window) {
    new ResizeObserver(function () { document.documentElement.style.setProperty('--top-h', $top.offsetHeight + 'px'); }).observe($top);
  }
  setInterval(function () { if (!document.hidden) render(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
  window.addEventListener('online', setSync);
  window.addEventListener('offline', setSync);
  window.addEventListener('storage', function (e) {
    if (e.key === LS_DATA && S.db && S.db.kind === 'local' && !S.sync) { var o = readLocal(); if (o) S.db.replace(o); }
    if (e.key === LS_THEME) applyTheme(e.newValue);
    if (e.key === LS_STYLE) applyStyle(e.newValue);
  });

  /* ---------- подписка на данные ---------- */
  function onEvents(snap) {
    var m = new Map();
    snap.docs.forEach(function (doc) { if (!doc.exists) return; var d = doc.data(); if (validDoc(d)) m.set(doc.id, d); });
    S.events = m; S.loaded = true;
    var md = snap.metadata || {};
    S.fromCache = !!md.fromCache; S.pendingSnap = !!md.hasPendingWrites;
    if (!S.fromCache) S.everSynced = true;
    if (S.syncErr === 'err') S.syncErr = null;
    updateDatalists(); setSync(); scheduleRender(); scheduleMirror();
    if (S.sheet && S.sheet.type === 'detail' && !S.sheet.confirm) refreshDetail();
    if (S.sheet && S.sheet.type === 'search') updateSearch(true);
  }
  function onSettingsSnap(snap) {
    S.settingsRaw = snap.exists ? snap.data() : null;
    applySettings(normSettings(S.settingsRaw));
    scheduleRender(); scheduleMirror();
  }
  function onSubError(e) {
    var code = e && e.code;
    if (code === 'permission-denied') S.syncErr = 'perm';
    else if (S.resubTries < 3) {
      if (!S.resubPending) {
        S.resubPending = true; S.resubTries++;
        try { if (S.unsubEv) S.unsubEv(); if (S.unsubSet) S.unsubSet(); } catch (x) { /* уже отписаны */ }
        setTimeout(function () { S.resubPending = false; subscribe(); }, 1500 + Math.random() * 2000);
      }
    } else S.syncErr = 'err';
    setSync(); renderBanners();
  }
  function subscribe() {
    try {
      S.unsubEv = S.db.collection('events').onSnapshot(onEvents, onSubError);
      S.unsubSet = S.db.doc('config/settings').onSnapshot(onSettingsSnap, onSubError);
    } catch (e) { onSubError(e); }
  }
  function useDb(db) {
    try { if (S.unsubEv) S.unsubEv(); if (S.unsubSet) S.unsubSet(); } catch (e) { /* уже отписаны */ }
    S.unsubEv = S.unsubSet = null;
    S.db = db; S.loaded = false; S.everSynced = false; S.fromCache = false; S.pendingSnap = false;
    S.syncErr = null; S.resubTries = 0;
    subscribe(); setSync(); render();
  }

  /* ---------- запуск ---------- */
  function handleHash() {
    var m = /^#sync=(.+)$/.exec(location.hash || '');
    if (!m) return;
    var sync = decodeSyncCode(decodeURIComponent(m[1]));
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* адрес не меняем */ }
    if (!sync) { toast('Код синхронизации в ссылке не распознан.'); return; }
    if (S.sync && S.sync.key === sync.key) return;
    S.pendingSync = sync;
    renderBanners();
  }
  function bootFire(sync, mirror) {
    S.fireFail = false; setSync(); renderBanners();
    withTimeout(startFire(sync), 20000).then(function (db) {
      S.readOnly = false; S.fireFail = false;
      useDb(db);
    }).catch(function () {
      S.fireFail = true; S.readOnly = true;
      if (mirror && (!S.db || S.db.kind !== 'local')) useDb(makeLocalDb(mirror, null));
      setSync(); render();
    });
  }
  function boot() {
    applyTheme(lsGet(LS_THEME));
    buildStyleMenu();
    applyStyle(lsGet(LS_STYLE) || curStyle());
    applySettings(normSettings(null));
    var ok = storageOk();
    S.noPersist = !ok;
    var local = ok ? readLocal() : null;
    if (!local) { local = { events: Object.assign(clone(SAMPLE_EVENTS), sampleDeadlines()), settings: null }; if (ok) writeLocal(local); }
    var sync = null;
    try { sync = JSON.parse(lsGet(LS_SYNC) || 'null'); } catch (e) { sync = null; }
    if (sync && validSync(sync)) {
      S.sync = sync; S.readOnly = true;
      useDb(makeLocalDb(local, null));
      bootFire(sync, local);
    } else {
      useDb(makeLocalDb(local, ok ? persistLocal : null));
    }
    handleHash();
    if (window.kpTermIntro) toast('Включена тема «Ночной терминал». Сменить оформление можно кнопкой вверху.');
  }
  boot();
})();
</script>
